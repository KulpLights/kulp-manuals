<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 220" font-family="Helvetica, Arial, sans-serif">
  <!-- 3-pin 3.5 mm pluggable header, seen from above with the plug removed -->
  <rect x="45" y="22" width="270" height="124" rx="6" fill="#5fd39b" stroke="#2e7d55" stroke-width="3"/>
  <!-- one socket cavity per pin: keyed slot at the top, rounded tooth at the bottom -->
  <g fill="#1b1b1b">
    <path d="M83 52 H97 V38 H123 V52 H137 V128 H125 A15 15 0 0 0 95 128 H83 Z"/>
    <path d="M153 52 H167 V38 H193 V52 H207 V128 H195 A15 15 0 0 0 165 128 H153 Z"/>
    <path d="M223 52 H237 V38 H263 V52 H277 V128 H265 A15 15 0 0 0 235 128 H223 Z"/>
  </g>
  <!-- pins -->
  <g fill="#d8d8d8" stroke="#9e9e9e" stroke-width="1">
    <rect x="104" y="80" width="12" height="12"/>
    <rect x="174" y="80" width="12" height="12"/>
    <rect x="244" y="80" width="12" height="12"/>
  </g>
  <g font-size="26" font-weight="700" text-anchor="middle">
    <text x="110" y="180" fill="#555">G</text>
    <text x="180" y="180" fill="#1565c0">D</text>
    <text x="250" y="180" fill="#c62828">V</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#777">
    <text x="110" y="205">Ground (−)</text>
    <text x="180" y="205">Data</text>
    <text x="250" y="205">Pixel +V</text>
  </g>
</svg>
